[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlight-viewport"
version = "0.1.0"
description = "PySide6 3D viewport for Ghostlight lens systems"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "PySide6>=6.4",
    "ghostlight-optics",
]

[project.urls]
Homepage = "https://github.com/JaydenB/ghostlight"
Issues = "https://github.com/JaydenB/ghostlight/issues"

[tool.setuptools.packages.find]
include = ["ghostlight_viewport*"]

[tool.setuptools.package-data]
"ghostlight_viewport.shaders" = ["*.vert", "*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
